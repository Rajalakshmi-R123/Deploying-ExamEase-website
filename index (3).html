<style>

kground:#f8fafc;color:#64748b}.table-wrap{overflow-x:auto}.badge{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:bold;background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:bold}.field input,.field select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;width:100%;min-width:0}.full{grid-column:1/-1}.notice{padding:13px;border-radius:9px;background:#eef2ff;color:#3730a3;font-size:13px;line-height:1.6;margin-bottom:15px}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{text-align:center;font-size:12px;color:var(--muted);padding:12px}hr{border:0;border-top:1px solid var(--border);margin:18px 0}@media(max-width:950px){.sidebar{width:200px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:17px}}@media(max-width:620px){.layout{display:block}.sidebar{width:100%;padding:13px}.tagline{display:none}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:12px;padding:9px}.topbar{height:58px;padding:0 14px}.content{padding:13px}.card{padding:13px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:23px}}@media print{.sidebar,.topbar,.no-print,.footer{display:none!important}.content{padding:0}body{background:white}}

<body><div class="layout"><aside class="sidebar"><div class="brand">Exam<span>Ease</span> 🎓</div><div class="tagline">SMART EXAM MANAGEMENT</div><nav class="nav"><button class="active" data-page="dashboard">▦ Dashboard</button>
<button data-page="exams">📝 Exams</button>
<button data-page="students">👥 Students</button>
<button data-page="rooms">🏫 Rooms</button>
<button data-page="invigilators">👨‍🏫 Invigilators</button>

<button data-page="reports">📊 Reports</button></nav></aside><main class="main"><header class="topbar"><strong id="topTitle">Dashboard</strong><small>Hackathon Prototype · Demo</small></header><div class="content" id="content"></div><div class="footer">ExamEase • Exam Timetabling & Invigilation Scheduling</div></main></div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10).toUpperCase();

const initial={
 exams:[
  {id:'EX101',name:'Mathematics',date:'2026-10-05',students:8,duration:2},
  {id:'EX102',name:'Programming in C',date:'2026-10-05',students:7,duration:2},
  {id:'EX103',name:'Artificial Intelligence',date:'2026-10-06',students:8,duration:2}
 ],
 students:[
  {id:'ST001',name:'Rajalakshmi R',year:'2nd Year',department:'AI & Data Science',section:'B',exam:'EX101'},
  {id:'ST001',name:'Rajalakshmi R',year:'2nd Year',department:'AI & Data Science',section:'B',exam:'EX102'},
  {id:'ST002',name:'Student 2',year:'2nd Year',department:'CSE',section:'A',exam:'EX101'},
  {id:'ST002',name:'Student 2',year:'2nd Year',department:'CSE',section:'A',exam:'EX103'},
  {id:'ST003',name:'Student 3',year:'3rd Year',department:'ECE',section:'A',exam:'EX101'},
  {id:'ST004',name:'Student 4',year:'1st Year',department:'AI & Data Science',section:'A',exam:'EX101'},
  {id:'ST005',name:'Student 5',year:'3rd Year',department:'CSE',section:'B',exam:'EX101'},
  {id:'ST006',name:'Student 6',year:'2nd Year',department:'IT',section:'A',exam:'EX102'},
  {id:'ST007',name:'Student 7',year:'1st Year',department:'ECE',section:'A',exam:'EX102'},
  {id:'ST008',name:'Student 8',year:'3rd Year',department:'AI & Data Science',section:'B',exam:'EX102'},
  {id:'ST009',name:'Student 9',year:'2nd Year',department:'CSE',section:'A',exam:'EX102'},
  {id:'ST010',name:'Student 10',year:'4th Year',department:'IT',section:'A',exam:'EX102'},
  {id:'ST011',name:'Student 11',year:'1st Year',department:'CSE',section:'B',exam:'EX103'},
  {id:'ST012',name:'Student 12',year:'3rd Year',department:'ECE',section:'A',exam:'EX103'},
  {id:'ST013',name:'Student 13',year:'2nd Year',department:'IT',section:'A',exam:'EX103'},
  {id:'ST014',name:'Student 14',year:'4th Year',department:'AI & Data Science',section:'B',exam:'EX103'}
 ],
 rooms:[

 ],
 invigilators:[
  {id:'I101',name:'Anita',available:true},{id:'I102',name:'Kumar',available:true},
  {id:'I103',name:'Priya',available:true},{id:'I104',name:'Arun',available:true}
 ],
 slots:[
  {id:'S1',label:'Morning',start:'09:00',end:'11:00'},
  {id:'S2',label:'Afternoon',start:'13:00',end:'15:00'}
 ],
 timetable:[],
 allocations:[]
};

let db;
try{db=JSON.parse(localStorage.getItem('examease_data'))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
db.students=(db.students||[]).map(s=>({...s,year:s.year||'2nd Year',department:s.department||'AI & Data Science',section:s.section||'A'}));
db.rooms=(db.rooms||[]).map(r=>({...r,building:r.building||'Main Block',floor:r.floor||'1',rows:r.rows||Math.ceil(Math.sqrt(r.capacity||1)),columns:r.columns||Math.ceil((r.capacity||1)/Math.ceil(Math.sqrt(r.capacity||1)))}));
db.allocations=db.allocations||[];
let page='dashboard';

function save(){localStorage.setItem('examease_data',JSON.stringify(db))}
function btn(t,fn,cl='primary'){return `<button class="${cl}" onclick="${fn}">${t}</button>`}
function table(h,rows){return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${h.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function stat(l,v,i,n){return `<div class="card"><span class="stat-icon">${i}</span><div class="stat-label">${l}</div><div class="stat-number">${v}</div><div class="muted">${n}</div></div>`}
function shell(t,s,b){$('topTitle').textContent=t;$('content').innerHTML=`<div class="page-title"><div><h1>${t}</h1><div class="muted">${s}</div></div></div>${b}`}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function render(){({dashboard,exams:examsPage,students:studentsPage,rooms:roomsPage,invigilators:staffPage,slots:slotsPage,timetable:timetablePage,seating:seatingPage,venue:venuePage,qr:qrPage,conflicts:conflictsPage,reports:reportsPage}[page]||dashboard)()}

function examName(id){return db.exams.find(e=>e.id===id)?.name||id}
function studentRows(examId){return db.students.filter(s=>s.exam===examId)}
function allExamStudentIds(examId){return [...new Set(studentRows(examId).map(s=>s.id))]}
function studentRecord(id,examId){return db.students.find(s=>s.id===id&&s.exam===examId)||db.students.find(s=>s.id===id)||{}}
function allocationFor(id,examId){return db.allocations.find(a=>a.studentId===id&&a.examId===examId)}
function roomName(id){return db.rooms.find(r=>r.id===id)?.name||id}
function slotInfo(id){return db.slots.find(s=>s.id===id)||{}}
function tokenFor(a){return a.qrToken||(a.qrToken=`EXE-${btoa(`${a.studentId}|${a.examId}|${a.date}|${a.seat}`).replace(/=/g,'').slice(0,28)}`)}

function dashboard(){
 let issues=checkConflicts(),scheduled=new Set(db.timetable.map(t=>t.examId)).size;
 let totalStudents=new Set(db.students.map(s=>s.id)).size;
 let assigned=db.allocations.length;
 shell('Dashboard','Smart exam scheduling, dynamic venue allocation and intelligent seating.',
 `<div class="stats">
 ${stat('Total Exams',db.exams.length,'📝','Registered examinations')}
 ${stat('Students',totalStudents,'👥','Unique students')}
 ${stat('Rooms',db.rooms.length,'🏫','Configured halls')}
 ${stat('Allocated Seats',assigned,'🪑','Student seat allocations')}
 ${stat('Scheduled Exams',scheduled,'📅','Exams with timetable')}
 ${stat('QR Codes',assigned,'▣','Venue QR records')}
 ${stat('Seating Issues',issues.filter(x=>x.type.includes('Adjacent')).length,'⚠','Adjacent same-exam')}
 ${stat('Total Issues',issues.length,'🔎','Validation findings')}
 </div>
 <div class="grid2">
 <section class="card"><h2>Quick Actions</h2><div class="actions">
 ${btn('➕ Add Exam',"go('exams')")}${btn('⚡ Generate Smart Schedule','generateSchedule()')}
 ${btn('🪑 Generate Seating','generateSeating()','secondary')}${btn('▣ QR Management',"go('qr')",'secondary')}
 </div><hr><div class="notice"><b>Smart rules:</b> avoid same room for a student on different dates, separate students writing the same exam, and use year/department to improve distribution.</div></section>
 <section class="card"><h2>System Status</h2><p>Allocated seats: <b>${assigned}</b></p><p>QR records: <b>${assigned}</b></p><p>Detected issues: <b>${issues.length}</b></p><span class="badge ${issues.length?'warn':''}">${issues.length?'Review required':'Ready for validation'}</span></section>
 </div>
 <section class="card"><h2>Exam Records</h2>${table(['ID','Subject','Date','Students','Duration'],db.exams.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.date)}</td><td>${e.students}</td><td>${e.duration}h</td></tr>`))}</section>`)
}

function examsPage(){
 shell('Exam Management','Add and manage examinations.',
 `<section class="card"><h2>Add Exam</h2><form id="examForm" class="form-grid">
 <div class="field"><label>Exam ID</label><input name="id" required placeholder="EX104"></div>
 <div class="field"><label>Subject</label><input name="name" required></div>
 <div class="field"><label>Date</label><input name="date" type="date" required></div>
 <div class="field"><label>Students (expected)</label><input name="students" type="number" min="1" required></div>
 <div class="field"><label>Duration (hours)</label><input name="duration" type="number" min="1" max="8" value="2" required></div>
 <div class="full"><button class="primary">Save Exam</button></div></form></section>
 <section class="card"><h2>All Exams</h2>${table(['ID','Subject','Date','Students','Duration','Action'],db.exams.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.date)}</td><td>${e.students}</td><td>${e.duration}h</td><td>${btn('Delete',`removeRecord('exams','${esc(e.id)}')`,'danger')}</td></tr>`))}</section>`);
 $('examForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:f.get('id').trim(),name:f.get('name').trim(),date:f.get('date'),students:+f.get('students'),duration:+f.get('duration')};if(db.exams.some(a=>a.id===x.id))return alert('Exam ID already exists');db.exams.push(x);clearGenerated();save();render()}
}

function studentsPage(){
 shell('Student Registration','Add students with year, department and section. These fields are used by seating allocation.',
 `<section class="card"><form id="regForm" class="form-grid">
 <div class="field"><label>Student / Register ID</label><input name="id" required placeholder="ST015"></div>
 <div class="field"><label>Student Name</label><input name="name" required></div>
 <div class="field"><label>Year of Study</label><select name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
 <div class="field"><label>Department</label><select name="department"><option>AI & Data Science</option><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option><option>Other</option></select></div>

 <div class="field"><label>Exam</label><select name="exam">${db.exams.map(e=>`<option value="${esc(e.id)}">${esc(e.id)} - ${esc(e.name)}</option>`).join('')}</select></div>

function roomsPage(){

 `<section class="card"><form id="roomForm" class="form-grid">
 <div class="field"><label>Room ID</label><input name="id" required></div><div class="field"><label>Room Name</label><input name="name" required></div>
 <div class="field"><label>Building</label><input name="building" value="Main Block"></div><div class="field"><label>Floor</label><input name="floor" value="1"></div>
 <div class="field"><label>Rows</label><input name="rows" type="number" min="1" value="3" required></div><div class="field"><label>Columns</label><input name="columns" type="number" min="1" value="4" required></div>

 <section class="card"><h2>Rooms</h2>${table(['ID','Building','Room','Capacity','Layout','Status','Actions'],db.rooms.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.building)}</td><td>${esc(r.name)}</td><td>${r.capacity}</td><td>${r.rows} × ${r.columns}</td><td>${r.available?'Available':'Unavailable'}</td><td>${btn(r.available?'Mark Unavailable':'Mark Available',`toggleAvailability('rooms','${esc(r.id)}')`,'secondary')} ${btn('Delete',`removeRecord('rooms','${esc(r.id)}')`,'danger')}</td></tr>`))}</section>`);

function slotsPage(){
 shell('Time Slots','Create exam sessions.',
 `<section class="card"><form id="slotForm" class="form-grid"><div class="field"><label>Slot ID</label><input name="id" required placeholder="S3"></div><div class="field"><label>Session Name</label><input name="label" required placeholder="Evening"></div><div class="field"><label>Start</label><input type="time" name="start" required></div><div class="field"><label>End</label><input type="time" name="end" required></div><div class="full"><button class="primary">Add Time Slot</button></div></form></section>
 <section class="card"><h2>Sessions</h2>${table(['ID','Session','Start','End','Action'],db.slots.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.label)}</td><td>${esc(s.start)}</td><td>${esc(s.end)}</td><td>${btn('Delete',`removeRecord('slots','${esc(s.id)}')`,'danger')}</td></tr>`))}</section>`);
 $('slotForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:f.get('id').trim(),label:f.get('label').trim(),start:f.get('start'),end:f.get('end')};if(db.slots.some(a=>a.id===x.id))return alert('Slot ID exists');if(x.start>=x.end)return alert('End must be after start');db.slots.push(x);clearGenerated();save();render()}
}

function generateSchedule(){
 if(!db.exams.length||!db.slots.length)return alert('Add exams and slots first');
 let rooms=db.rooms.filter(r=>r.available),staff=db.invigilators.filter(i=>i.available);
 if(!rooms.length||!staff.length)return alert('Need an available room and invigilator');
 let result=[],usedR=new Set(),usedI=new Set(),groups={};
 db.students.forEach(s=>(groups[s.exam]??=new Set()).add(s.id));
 let slots=[...db.slots].sort((a,b)=>a.start.localeCompare(b.start)),exams=[...db.exams].sort((a,b)=>b.students-a.students);
 for(let e of exams){
   let placed=false;
   for(let offset=0;offset<60&&!placed;offset++){
     let d=new Date(e.date+'T12:00:00');d.setDate(d.getDate()+offset);
     let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
     for(let s of slots){
       let clash=result.some(t=>t.date===date&&t.slotId===s.id&&[...(groups[e.id]||[])].some(id=>(groups[t.examId]||new Set()).has(id)));
       if(clash)continue;
       for(let r of rooms){
         if(r.capacity<Math.min(e.students,r.capacity)||usedR.has(`${date}|${s.id}|${r.id}`))continue;
         let i=staff.find(x=>!usedI.has(`${date}|${s.id}|${x.id}`));if(!i)continue;
         result.push({examId:e.id,date,slotId:s.id,roomId:r.id,invigilatorId:i.id});
         usedR.add(`${date}|${s.id}|${r.id}`);usedI.add(`${date}|${s.id}|${i.id}`);placed=true;break
       }
       if(placed)break
     }
   }
   if(!placed)alert(`Could not allocate ${e.name}. Check rooms, staff, slots and registrations.`)
 }
 db.timetable=result; db.allocations=[]; save(); generateSeating(); go('timetable')
}

function previousRooms(studentId, date){return new Set(db.allocations.filter(a=>a.studentId===studentId&&a.date!==date).map(a=>a.roomId))}

function generateSeating(){
 if(!db.timetable.length)return alert('Generate the timetable first.');
 db.allocations=[];
 let hardFailures=[];
 for(let t of db.timetable){
   let ids=allExamStudentIds(t.examId);
   if(!ids.length)continue;
   let room=db.rooms.find(r=>r.id===t.roomId);if(!room)continue;
   let max=Math.min(room.capacity,room.rows*room.columns);
   // If an exam exceeds one room, the current timetable should contain additional room assignments.
   // For this prototype, create allocations for as many seats as the room provides.
   let idsForRoom=ids.slice(0,max);
   let seats=[];
   for(let row=0;row<room.rows;row++)for(let col=0;col<room.columns;col++){
     let n=row*room.columns+col+1;if(n<=max)seats.push({row,col,seat:`${String.fromCharCode(65+row)}-${String(n).padStart(2,'0')}`})
   }
   let placed=[];
   for(let id of idsForRoom){
     let s=studentRecord(id,t.examId), prev=previousRooms(id,t.date);
     let candidates=seats.filter(x=>!placed.some(p=>p.seat===x.seat));
     candidates.sort((a,b)=>seatPenalty(a,placed,s,prev,room)-seatPenalty(b,placed,s,prev,room));
     let best=candidates[0];
     if(!best){hardFailures.push(`${id} in ${room.name}`);continue}
     placed.push({seat:best.seat,row:best.row,col:best.col,studentId:id});
     db.allocations.push({studentId:id,studentName:s.name,examId:t.examId,date:t.date,slotId:t.slotId,roomId:t.roomId,seat:best.seat,year:s.year,department:s.department,section:s.section,qrToken:''})
   }
 }
 save();
 if(hardFailures.length)alert('Some students could not be seated: '+hardFailures.join(', '));
 go('seating')
}

function seatPenalty(seat,placed,s,prev,room){
 let p=0;
 if(prev.has(room.id))p+=1000;
 for(let q of placed){
   let dr=Math.abs(q.row-seat.row),dc=Math.abs(q.col-seat.col);
   if(dr<=1&&dc<=1){
     let other=studentRecord(q.studentId,s.exam);
     if(q.studentId===s.id)p+=100000;
     // Same-exam is the strongest seating constraint.
     if(q.examId===s.exam)p+=100000;
     if(other.year===s.year)p+=500;
     if(other.department===s.department)p+=300;
   }
 }
 return p
}

function getSeatNeighbors(a){
 let room=db.rooms.find(r=>r.id===a.roomId), seatNum=parseInt(String(a.seat).split('-')[1]||'1')-1;
 let row=seatNum>=0?Math.floor(seatNum/room.columns):0,col=seatNum>=0?seatNum%room.columns:0;
 return db.allocations.filter(x=>x.roomId===a.roomId&&x.date===a.date&&x.slotId===a.slotId).filter(x=>{
   let n=parseInt(String(x.seat).split('-')[1]||'1')-1,nr=Math.floor(n/room.columns),nc=n%room.columns;
   return Math.abs(nr-row)<=1&&Math.abs(nc-col)<=1&&x.studentId!==a.studentId;
 })
}

function checkConflicts(){
 let out=[],by={};
 db.timetable.forEach(t=>{
   let e=db.exams.find(x=>x.id===t.examId),r=db.rooms.find(x=>x.id===t.roomId),i=db.invigilators.find(x=>x.id===t.invigilatorId);
   if(!e){out.push({type:'Missing exam',detail:t.examId});return}
   if(!r)out.push({type:'Missing room',detail:e.name});
   else if(!r.available)out.push({type:'Unavailable room',detail:r.name});
   if(i&&!i.available)out.push({type:'Unavailable invigilator',detail:i.name});
   (by[t.date+'|'+t.slotId]??=[]).push(t)
 });
 Object.values(by).forEach(a=>{for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++){
   if(a[x].roomId===a[y].roomId)out.push({type:'Room clash',detail:`${a[x].examId} and ${a[y].examId}`});
   if(a[x].invigilatorId===a[y].invigilatorId)out.push({type:'Staff clash',detail:`${a[x].invigilatorId}: ${a[x].examId} and ${a[y].examId}`});
 }});
 let groups={};db.students.forEach(s=>(groups[s.id]??=new Set()).add(s.exam));
 Object.entries(groups).forEach(([id,ids])=>{let a=[...ids];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)for(let p of db.timetable.filter(t=>t.examId===a[x]))for(let q of db.timetable.filter(t=>t.examId===a[y]))if(p.date===q.date&&p.slotId===q.slotId)out.push({type:'Student clash',detail:`${id}: ${p.examId} and ${q.examId}`})});
 // Seat-level checks
 db.allocations.forEach(a=>{
   getSeatNeighbors(a).forEach(n=>{
     if(n.examId===a.examId && n.studentId>a.studentId)out.push({type:'Adjacent same-exam',detail:`${a.studentId} and ${n.studentId} (${examName(a.examId)}) in ${roomName(a.roomId)}`});
   });
   let repeats=db.allocations.filter(x=>x.studentId===a.studentId&&x.date!==a.date&&x.roomId===a.roomId);
   if(repeats.some(x=>x.examId!==a.examId))out.push({type:'Repeated venue',detail:`${a.studentId} uses ${roomName(a.roomId)} on multiple dates`});
 });
 let seatKeys=new Set();db.allocations.forEach(a=>{let k=`${a.date}|${a.slotId}|${a.roomId}|${a.seat}`;if(seatKeys.has(k))out.push({type:'Duplicate seat',detail:k});seatKeys.add(k)});
 return out;
}

const QREngine=(()=>{

  const M=Array.from({length:size},()=>Array(size).fill(false)),F=Array.from({length:size},()=>Array(size).fill(false));

  finder(3,3);finder(size-4,3);finder(3,size-4);
  let pos=[];if(v>1){const na=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(na*2-2))*2;pos=[6];for(let p=size-7;pos.length<na;p-=step)pos.splice(1,0,p)}

  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};

  const penalty=()=>{let p=0,dark=0;const lines=[];
    for(let y=0;y<size;y++){lines.push(M[y].map(b=>b?1:0).join(''));}
    for(let x=0;x<size;x++){let s='';for(let y=0;y<size;y++)s+=M[y][x]?1:0;lines.push(s)}
    lines.forEach(s=>{const runs=s.match(/0+|1+/g)||[];runs.forEach(r=>{if(r.length>=5)p+=r.length-2});p+=40*((s.match(/(?=00001011101|10111010000)/g)||[]).length)});

  let best=0,bp=Infinity;for(let m=0;m<8;m++){applyMask(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m}applyMask(m)}
  applyMask(best);fmt(best);
  return {size,modules:M,version:v};
}
function draw(canvas,text,target){
  const q=encode(text),quiet=4,total=q.size+quiet*2,scale=Math.max(3,Math.floor((target||canvas.width)/total));

  for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)if(q.modules[y][x])ctx.fillRect((x+quiet)*scale,(y+quiet)*scale,scale,scale);
  return q;
}
return {encode,draw};
})();

function drawQR(id,text){
 let c=$(id);if(!c)return;
 try{QREngine.draw(c,text,c.dataset.size?+c.dataset.size:(c.getAttribute('width')|0)||220)}
 catch(err){let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#b91c1c';x.font='12px sans-serif';x.fillText('QR error: '+err.message,8,20)}
}
function downloadCanvasQR(){let c=$('qrCanvas')||$('venueQR');if(!c)return;let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(c.dataset.name||'ExamEase-QR')+'.png';a.click()}

function conflictsPage(){
 let a=checkConflicts();
 shell('Conflict Checker','Validate timetable, venue and seating constraints.',
 `<div class="stats">${stat('Total Issues',a.length,'⚠','Detected')}${stat('Room Clashes',a.filter(x=>x.type.includes('Room')).length,'🏫','Room')}${stat('Student Clashes',a.filter(x=>x.type.includes('Student')).length,'👥','Time clashes')}${stat('Adjacent Same Exam',a.filter(x=>x.type.includes('Adjacent')).length,'🪑','Seating')}</div>
 <section class="card"><div class="actions no-print">${btn('Run Validation',"go('conflicts')")}${btn('Repair / Regenerate','generateSeating()','secondary')}</div><hr>${a.length?table(['Issue','Details','Status'],a.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.detail)}</td><td><span class="badge bad">Review</span></td></tr>`)):'<div class="empty">✓ No issues detected by the current validator.</div>'}</section>`)
}

function reportsPage(){
 let done=new Set(db.timetable.map(t=>t.examId)),left=db.exams.filter(e=>!done.has(e.id));
 shell('Reports','Review coverage and export timetable, seating and QR data.',
 `<div class="stats">${stat('Total Exams',db.exams.length,'📝','Exam records')}${stat('Allocated Seats',db.allocations.length,'🪑','Seat allocations')}${stat('Unallocated Exams',left.length,'⏳','Awaiting schedule')}${stat('Issues',checkConflicts().length,'⚠','Validation issues')}</div>
 <section class="card"><div class="actions no-print">${btn('Print / Save PDF','window.print()')}${btn('Export Timetable CSV','exportTimetableCSV()','secondary')}${btn('Export Seating CSV','exportSeatingCSV()','secondary')}${btn('Export All Data JSON','exportJSON()','secondary')}</div><hr><h2>Unallocated Exams</h2>${table(['ID','Subject','Date','Students'],left.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.date)}</td><td>${e.students}</td></tr>`))}</section>`)
}

function removeRecord(c,id){if(!confirm('Delete this record?'))return;db[c]=db[c].filter(x=>x.id!==id);if(c==='exams')db.students=db.students.filter(s=>s.exam!==id);db.timetable=db.timetable.filter(t=>c==='exams'?t.examId!==id:c==='rooms'?t.roomId!==id:c==='invigilators'?t.invigilatorId!==id:c==='slots'?t.slotId!==id:true);clearGenerated(false);save();render()}
function removeRegistration(i){db.students.splice(i,1);clearGenerated();save();render()}
function toggleAvailability(c,id){let x=db[c].find(a=>a.id===id);if(x){x.available=!x.available;clearGenerated();save();render()}}
function removeAssignment(id){db.timetable=db.timetable.filter(t=>t.examId!==id);db.allocations=db.allocations.filter(a=>a.examId!==id);save();render()}
function clearTimetable(){if(confirm('Clear all timetable and seating allocations?')){db.timetable=[];db.allocations=[];save();render()}}
function clearGenerated(saveNow=true){db.timetable=[];db.allocations=[];if(saveNow)save()}
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportTimetableCSV(){let rows=[['Exam ID','Subject','Date','Slot','Room','Invigilator'],...db.timetable.map(t=>[t.examId,examName(t.examId),t.date,slotInfo(t.slotId).label||t.slotId,roomName(t.roomId),t.invigilatorId])];download('examease-timetable.csv',rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportSeatingCSV(){let rows=[['Student ID','Student Name','Year','Department','Exam','Date','Room','Seat','QR Token'],...db.allocations.map(a=>[a.studentId,a.studentName,a.year,a.department,examName(a.examId),a.date,roomName(a.roomId),a.seat,tokenFor(a)])];download('examease-seating.csv',rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportJSON(){download('examease-data.json',JSON.stringify(db,null,2),'application/json')}

// Support direct QR/venue links: ?venue=TOKEN
function handleVenueToken(){
 let token=new URLSearchParams(location.search).get('venue');if(!token)return;
 let a=db.allocations.find(x=>tokenFor(x)===token);if(a){go('venue');setTimeout(()=>showVenue(a.studentId,a.examId),0)}
}
save();render();handleVenueToken();
</script>
</body></html>
